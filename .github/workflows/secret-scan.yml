name: Secret scan

on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label for this job.
        required: true
        type: string
      config-path:
        description: Optional repository-relative Gitleaks configuration path.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Manual dispatch is the explicit full-history audit. Routine PR and
          # push scans use a shallow range and deepen only if their base commit
          # falls outside it.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '50' }}

      - name: Ensure incremental range is available
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_AFTER_SHA: ${{ github.event.after || github.sha }}
        run: |
          set -euo pipefail

          base_sha=''
          head_sha=''
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]] \
            && [[ -n "$PUSH_BEFORE_SHA" ]] \
            && [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_AFTER_SHA"
          fi

          if [[ -n "$base_sha" ]] \
            && { ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null \
              || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; }; then
            git fetch --no-tags --no-recurse-submodules --unshallow origin
          fi

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)
              gitleaks_arch="x64"
              gitleaks_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              ;;
            aarch64|arm64)
              gitleaks_arch="arm64"
              gitleaks_sha256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
              ;;
            *)
              echo "Unsupported Linux architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          download_dir="$RUNNER_TEMP/secret-scan-download"
          bin_dir="$RUNNER_TEMP/secret-scan-bin"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_${gitleaks_arch}.tar.gz"
          mkdir -p "$download_dir" "$bin_dir"

          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$download_dir/$archive"
          (
            cd "$download_dir"
            printf '%s  %s\n' "$gitleaks_sha256" "$archive" | sha256sum --check -
          )
          tar -xzf "$download_dir/$archive" -C "$bin_dir" gitleaks
          chmod 0755 "$bin_dir/gitleaks"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan commits for secrets
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_AFTER_SHA: ${{ github.event.after || github.sha }}
        run: |
          set -euo pipefail
          scan_args=(git --redact --exit-code 1)

          if [[ -n "$CONFIG_PATH" ]]; then
            if [[ ! -f "$CONFIG_PATH" ]]; then
              echo "Gitleaks configuration not found: $CONFIG_PATH" >&2
              exit 1
            fi
            scan_args+=(--config="$CONFIG_PATH")
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            scan_args+=(--log-opts="$PR_BASE_SHA..$PR_HEAD_SHA")
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]] \
            && [[ -n "$PUSH_BEFORE_SHA" ]] \
            && [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            scan_args+=(--log-opts="$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA")
          elif [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]] \
            && git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            scan_args+=(--log-opts="${GITHUB_SHA}^..${GITHUB_SHA}")
          fi

          gitleaks "${scan_args[@]}" .
