name: Shared checks

on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label for the job.
        required: false
        type: string
        default: self-hosted

concurrency:
  group: shared-checks-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Shared checks
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check changed-file hygiene
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_AFTER_SHA: ${{ github.event.after || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]] \
            && [[ -n "$PUSH_BEFORE_SHA" ]] \
            && [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA"
          elif git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            git diff --check "${GITHUB_SHA}^..${GITHUB_SHA}"
          else
            git diff-tree --check --root -r "$GITHUB_SHA"
          fi

      - name: Install pinned CI tools
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)
              actionlint_arch="amd64"
              actionlint_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              gitleaks_arch="x64"
              gitleaks_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              ;;
            aarch64|arm64)
              actionlint_arch="arm64"
              actionlint_sha256="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
              gitleaks_arch="arm64"
              gitleaks_sha256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
              ;;
            *)
              echo "Unsupported Linux architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          download_dir="$RUNNER_TEMP/shared-checks-downloads"
          bin_dir="$RUNNER_TEMP/shared-checks-bin"
          mkdir -p "$download_dir" "$bin_dir"

          actionlint_archive="actionlint_${ACTIONLINT_VERSION}_linux_${actionlint_arch}.tar.gz"
          gitleaks_archive="gitleaks_${GITLEAKS_VERSION}_linux_${gitleaks_arch}.tar.gz"

          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint_archive}" \
            --output "$download_dir/$actionlint_archive"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${gitleaks_archive}" \
            --output "$download_dir/$gitleaks_archive"

          (
            cd "$download_dir"
            printf '%s  %s\n' "$actionlint_sha256" "$actionlint_archive" | sha256sum --check -
            printf '%s  %s\n' "$gitleaks_sha256" "$gitleaks_archive" | sha256sum --check -
          )

          tar -xzf "$download_dir/$actionlint_archive" -C "$bin_dir" actionlint
          tar -xzf "$download_dir/$gitleaks_archive" -C "$bin_dir" gitleaks
          chmod 0755 "$bin_dir/actionlint" "$bin_dir/gitleaks"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          # Shell style and custom self-hosted runner labels are repo-specific.
          # This shared check owns workflow structure and expression validity.
          actionlint \
            -color \
            -shellcheck= \
            -pyflakes= \
            -ignore 'label ".+" is unknown'

      - name: Scan changed commits for secrets
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_AFTER_SHA: ${{ github.event.after || github.sha }}
        run: |
          set -euo pipefail
          scan_args=(git --redact --exit-code 1)

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            scan_args+=(--log-opts="$PR_BASE_SHA..$PR_HEAD_SHA")
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]] \
            && [[ -n "$PUSH_BEFORE_SHA" ]] \
            && [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            scan_args+=(--log-opts="$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA")
          elif git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            scan_args+=(--log-opts="${GITHUB_SHA}^..${GITHUB_SHA}")
          fi

          gitleaks "${scan_args[@]}" .
