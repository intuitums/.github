name: Workflow lint

on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label for this job.
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)
              actionlint_arch="amd64"
              actionlint_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              ;;
            aarch64|arm64)
              actionlint_arch="arm64"
              actionlint_sha256="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
              ;;
            *)
              echo "Unsupported Linux architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          download_dir="$RUNNER_TEMP/workflow-lint-download"
          bin_dir="$RUNNER_TEMP/workflow-lint-bin"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_${actionlint_arch}.tar.gz"
          mkdir -p "$download_dir" "$bin_dir"

          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$download_dir/$archive"
          (
            cd "$download_dir"
            printf '%s  %s\n' "$actionlint_sha256" "$archive" | sha256sum --check -
          )
          tar -xzf "$download_dir/$archive" -C "$bin_dir" actionlint
          chmod 0755 "$bin_dir/actionlint"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          actionlint \
            -color \
            -shellcheck= \
            -pyflakes= \
            -ignore 'label ".+" is unknown'
